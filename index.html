<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Codename : Zetta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🎬 BACKGROUND VIDEO -->
  <video class="bg" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- 🎵 MUSIC -->
  <audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- 🔊 CLICK SOUND -->
  <audio id="clickSfx">
    <source src="click.mp3" type="audio/mpeg">
  </audio>

  <main class="container">

    <img src="profile.png" class="profile-img" alt="Profile">

    <h1>Codename : Zetta</h1>

    <p class="desc">
      Download Modpack, Shader, Texture Pack For Java & Bedrock
    </p>

    <a href="https://zettaxr-dotcom.github.io/ZettaJava/" class="btn click">🌌 Java</a>
    <a href="#" class="btn click">🌎 Bedrock</a>
    <a href="https://linktr.ee/Zettarealms" class="btn click">🌳 Linktree</a>
    <a href="https://youtube.com/@zettaxr?si=PUA5OJtLotW2Kcby" class="btn click">📌 Youtube</a>
    <a href="https://whatsapp.com/channel/0029Vb7WE39GzzKOH94qKL2l" class="btn click">🏛️ Saluran Wa</a>
    <a href="https://www.tiktok.com/@zetta.xr?_r=1&_t=ZS-96N0pVPzRXY" class="btn click">🔗 Tik Tok</a>

    <footer>
      <p>Codename : Zetta 👑</p>
    </footer>

  </main>

  <script>
    // 🎧 MUSIC START ON CLICK (anti block browser)
    const bgm = document.getElementById("bgm");
    document.body.addEventListener("click", () => {
      bgm.volume = 0.5;
      bgm.play();
    }, { once: true });

    // 🔊 CLICK SFX
    const clickSfx = document.getElementById("clickSfx");

    document.querySelectorAll(".click").forEach(el => {
      el.addEventListener("click", () => {
        clickSfx.currentTime = 0;
        clickSfx.play();
      });
    });
  </script>

</body>
</html>
