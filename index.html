  <!-- PARTICLE SCRIPT -->
  <script>
    const leavesContainer =
      document.querySelector('.leaves');

    function createLeaf(){

      const leaf =
        document.createElement('div');

      leaf.classList.add('leaf');

      const particles =
        ['🌎','🌌','🌧️];

      leaf.innerHTML =
        particles[Math.floor(
          Math.random() * particles.length
        )];

      leaf.style.left =
        Math.random() * window.innerWidth + 'px';

      leaf.style.animationDuration =
        (Math.random() * 6 + 8) + 's';

      leaf.style.fontSize =
        (Math.random() * 18 + 14) + 'px';

      leaf.style.opacity =
        Math.random();

      leavesContainer.appendChild(leaf);

      setTimeout(() => {
        leaf.remove();
      }, 14000);
    }

    setInterval(createLeaf, 500);
  </script>

</body>
