<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Codename : Zetta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- VIDEO BACKGROUND (DIEMIN AUDIO NYA) -->
  <video class="bg" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- 🎵 MUSIC ONLY MP3 -->
  <audio id="bgm" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- 🔊 CLICK SFX -->
  <audio id="clickSfx">
    <source src="click.mp3" type="audio/mpeg">
  </audio>

  <!-- 🌌 PARTICLE -->
  <div class="particles"></div>

  <main class="container">

    <img src="profile.png" alt="Profile" class="profile-img">

    <h1>Codename : Zetta</h1>

    <p class="desc">
      Download Modpack, Shader, Texture Pack For Java & Bedrock
    </p>

    <!-- BUTTONS (SEMUA ADA SFX) -->
    <a href="https://zettaxr-dotcom.github.io/ZettaJava/" class="btn click">
      🌌 Java
    </a>

    <a href="#" class="btn click">
      🌎 Bedrock
    </a>

    <a href="https://linktr.ee/Zettarealms" class="btn click">
      🌳 Linktree
    </a>

    <a href="https://youtube.com/@zettaxr?si=PUA5OJtLotW2Kcby" class="btn click">
      📌 Youtube
    </a>

    <a href="https://whatsapp.com/channel/0029Vb7WE39GzzKOH94qKL2l" class="btn click">
      🏛️ Saluran Wa
    </a>

    <a href="https://www.tiktok.com/@zetta.xr?_r=1&_t=ZS-96N0pVPzRXY" class="btn click">
      🔗 Tik Tok
    </a>

    <footer>
      <p>Codename : Zetta 👑</p>
    </footer>

  </main>

  <!-- SCRIPT -->
  <script>
    /* 🎵 auto play fix (biar gak silent bug) */
    const bgm = document.getElementById("bgm");
    document.body.addEventListener("click", () => {
      bgm.play();
    }, { once: true });

    /* 🔊 CLICK SOUND */
    const clickSfx = document.getElementById("clickSfx");

    document.querySelectorAll(".click").forEach(el => {
      el.addEventListener("click", () => {
        clickSfx.currentTime = 0;
        clickSfx.play();
      });
    });

    /* 🌧️🌎🌌 PARTICLE SYSTEM */
    const container = document.querySelector(".particles");

    function spawnParticle() {
      const p = document.createElement("div");
      p.classList.add("particle");

      const items = ["🌧️", "🌎", "🌌"];
      p.innerHTML = items[Math.floor(Math.random() * items.length)];

      p.style.left = Math.random() * window.innerWidth + "px";
      p.style.fontSize = (Math.random() * 18 + 14) + "px";
      p.style.animationDuration = (Math.random() * 6 + 6) + "s";
      p.style.opacity = Math.random();

      container.appendChild(p);

      setTimeout(() => p.remove(), 12000);
    }

    setInterval(spawnParticle, 400);
  </script>

</body>
</html>
